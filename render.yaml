services:
  - type: web
    name: promptlens-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: HF_API_TOKEN
        sync: false
      - key: HF_MODEL_ID
        value: meta-llama/Llama-3.1-8B-Instruct
      - key: CORS_ORIGINS
        value: https://your-frontend.vercel.app
      - key: PYTHON_VERSION
        value: 3.11.9
